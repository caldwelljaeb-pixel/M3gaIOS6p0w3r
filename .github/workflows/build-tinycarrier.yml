name: Build TinyCarrier (test only)

on:
  push:
    paths:
      - "projects/TinyCarrier/**"
      - ".github/workflows/build-tinycarrier.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make perl git dpkg-dev fakeroot libplist-dev libssl-dev xz-utils
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git "$RUNNER_TEMP/ldid"
          make -C "$RUNNER_TEMP/ldid" -j2
          sudo install -m 0755 "$RUNNER_TEMP/ldid/ldid" /usr/local/bin/ldid

      - name: Install Theos and iOS 9.3 SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl --location --fail --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS9.3.sdk.tar.xz \
            --output "$RUNNER_TEMP/iPhoneOS9.3.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS9.3.sdk.tar.xz" -C "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS9.3.sdk"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build test package
        working-directory: projects/TinyCarrier
        run: |
          make package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: TinyCarrier-test-build
          path: projects/TinyCarrier/packages/*.deb
          if-no-files-found: error
          retention-days: 14
