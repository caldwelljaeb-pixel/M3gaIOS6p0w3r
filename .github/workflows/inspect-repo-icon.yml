name: Resize classic Cydia source icon

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-repo-icon.yml"

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare correctly sized source icons
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from PIL import Image
          source = Image.open("CydiaIcon.png").convert("RGBA")
          source.resize((64, 64), Image.Resampling.LANCZOS).save("CydiaIcon.png", optimize=True)
          source.resize((128, 128), Image.Resampling.LANCZOS).save("CydiaIcon@2x.png", optimize=True)
          source.resize((192, 192), Image.Resampling.LANCZOS).save("CydiaIcon@3x.png", optimize=True)
          print("Created 64x64, 128x128, and 192x192 repository icons.")
          PY

      - name: Publish resized icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CydiaIcon.png CydiaIcon@2x.png CydiaIcon@3x.png
          if git diff --cached --quiet; then
            echo "No icon changes to publish."
            exit 0
          fi
          git commit -m "Optimize Cydia repository icon sizes for legacy devices"
          git push
