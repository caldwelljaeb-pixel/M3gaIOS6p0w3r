name: Inspect repository icon asset

on:
  push:
    paths:
      - ".github/workflows/inspect-repo-icon.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload original Cydia icon
        uses: actions/upload-artifact@v4
        with:
          name: Original-CydiaIcon
          path: CydiaIcon.png
          retention-days: 2
