name: Build StatusBarColor (test only)

on:
  push:
    paths:
      - "projects/StatusBarColor/**"
      - ".github/workflows/build-statusbarcolor.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make perl git dpkg-dev fakeroot libplist-dev libssl-dev pkg-config curl xz-utils libtinfo6 unzip
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git "$RUNNER_TEMP/ldid"
          make -C "$RUNNER_TEMP/ldid" -j2
          sudo install -m 0755 "$RUNNER_TEMP/ldid/ldid" /usr/local/bin/ldid

      - name: Install Theos and iOS SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 --max-time 600 https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip -o "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip"
          unzip -q "$RUNNER_TEMP/iPhoneOS6.1.sdk.zip" -d "$HOME/theos/sdks/"
          test -d "$HOME/theos/sdks/iPhoneOS6.1.sdk"
          mkdir -p "$HOME/theos/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$HOME/theos/toolchain/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build test package
        working-directory: projects/StatusBarColor
        run: |
          chmod 0755 layout/DEBIAN/postinst
          make package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: StatusBarColor-test-build
          path: projects/StatusBarColor/packages/*.deb
          if-no-files-found: error
          retention-days: 14
