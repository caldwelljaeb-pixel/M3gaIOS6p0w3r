name: Build Doodle Jump Hack (test only)

on:
  push:
    paths:
      - "projects/DoodleJumpHack/**"
      - ".github/workflows/build-doodlejumphack.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bash build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 python3

      - name: Install Theos, Linux toolchain, and iOS 9.3 SDK
        env:
          THEOS: ${{ runner.temp }}/theos
          CI: "true"
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          "$THEOS/bin/install-sdk" iPhoneOS9.3
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/ldid"
          test -d "$THEOS/sdks/iPhoneOS9.3.sdk"
          # Keep ARM device architectures in top-level SDK stubs.
          # Nested exports.archs declarations remain unchanged.
          python3 - "$THEOS/sdks/iPhoneOS9.3.sdk" <<'PY'
          import pathlib, re, sys
          sdk = pathlib.Path(sys.argv[1])
          pattern = re.compile(r"(?m)^(archs:\s*\[)([^\]]*)(\])")
          changed = 0
          for stub in sdk.rglob("*.tbd"):
              try:
                  source = stub.read_text()
              except (OSError, UnicodeError):
                  continue
              def fix(match):
                  items = [item.strip() for item in match.group(2).split(",")]
                  items = [item for item in items if item not in {"i386", "x86_64"}]
                  return match.group(1) + ", ".join(items) + match.group(3)
              patched, count = pattern.subn(fix, source)
              if count and patched != source:
                  stub.write_text(patched)
                  changed += 1
          print(f"Adjusted top-level architecture declarations in {changed} SDK stubs")
          if changed == 0:
              raise SystemExit("No top-level SDK architecture declarations were patched")
          # The 9.3 SDK's libSystem.tbd advertises liblaunch as a re-export,
          # but the matching liblaunch.tbd stub is absent from this SDK tree.
          # This tweak does not use liblaunch symbols, so omit only that
          # build-time re-export instead of inventing a fake library stub.
          libsystem = sdk / "usr/lib/libSystem.tbd"
          libsystem_text = libsystem.read_text()
          missing = "/usr/lib/system/liblaunch.dylib, "
          if missing not in libsystem_text:
              raise SystemExit("Expected liblaunch re-export entry was not found")
          libsystem.write_text(libsystem_text.replace(missing, "", 1))
          print("Removed missing, unused liblaunch re-export from the build SDK")
          PY
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build test package
        working-directory: projects/DoodleJumpHack
        run: |
          make clean package FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: DoodleJumpHack-test-build
          path: projects/DoodleJumpHack/packages/*.deb
          if-no-files-found: error
          retention-days: 14
