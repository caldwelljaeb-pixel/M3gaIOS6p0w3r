name: Repair Cydia repository metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-cydia-repo.yml'
      - 'debs/**'
      - 'Packages'
      - 'Packages.gz'
      - 'Release'
      - 'Packages (3)'
      - 'Packages (3).gz'
      - 'Release (3)'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils

      - name: Download tested M3gaAppCustomizer 0.1.7 release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/42538664621/artifacts" \
            -o "$WORK/artifacts.json"

          ARTIFACT_ID="$(python3 - "$WORK/artifacts.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == "M3gaAppCustomizer-0.1.7-deb"
              and not item.get("expired", False)
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected one active 0.1.7 artifact, found {len(matches)}")
          print(matches[0]["id"])
          PY
          )"

          curl -fsSL -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$WORK/M3gaAppCustomizer-0.1.7.zip"

          mkdir -p debs
          python3 - "$WORK/M3gaAppCustomizer-0.1.7.zip" debs <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              candidates = [name for name in archive.namelist() if name.endswith(".deb")]
              if len(candidates) != 1:
                  raise SystemExit(f"Expected one Debian package in artifact, found {len(candidates)}")
              source = candidates[0]
              destination = pathlib.Path(sys.argv[2]) / "com.m3ga.appcustomizer_0.1.7_iphoneos-arm.deb"
              destination.write_bytes(archive.read(source))
              print(f"Extracted {source} -> {destination}")
          PY

          DEB="debs/com.m3ga.appcustomizer_0.1.7_iphoneos-arm.deb"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.m3ga.appcustomizer"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.1.7"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb -f "$DEB" Maintainer)" = "M3gaIOS6p0w3r"
          echo "Verified $DEB"
          dpkg-deb --info "$DEB"

      - name: Download tested M3gaNoBadges 0.1.1 release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/42543980534/artifacts" \
            -o "$WORK/artifacts.json"

          ARTIFACT_ID="$(python3 - "$WORK/artifacts.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("name") == "M3gaNoBadges-0.1.1-deb"
              and not item.get("expired", False)
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected one active M3gaNoBadges 0.1.1 artifact, found {len(matches)}")
          print(matches[0]["id"])
          PY
          )"

          curl -fsSL -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$WORK/M3gaNoBadges-0.1.1.zip"

          mkdir -p debs
          python3 - "$WORK/M3gaNoBadges-0.1.1.zip" debs <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              candidates = [name for name in archive.namelist() if name.endswith(".deb")]
              if len(candidates) != 1:
                  raise SystemExit(f"Expected one M3gaNoBadges Debian package, found {len(candidates)}")
              destination = pathlib.Path(sys.argv[2]) / "com.m3ga.nobadges_0.1.1_iphoneos-arm.deb"
              destination.write_bytes(archive.read(candidates[0]))
              print(f"Extracted {candidates[0]} -> {destination}")
          PY

          DEB="debs/com.m3ga.nobadges_0.1.1_iphoneos-arm.deb"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.m3ga.nobadges"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.1.1"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          dpkg-deb -f "$DEB" Description | grep -F "made with ❤️ by M3gaIOS6p0w3r"
          echo "Verified tested M3gaNoBadges 0.1.1 artifact."
          dpkg-deb --info "$DEB"

      - name: Fix package author and maintainer fields
        shell: bash
        run: |
          set -euo pipefail

          DEB="debs/com.caldwelljaeb.ebayslider.palelemon_1.0_iphoneos-arm.deb"
          test -f "$DEB"

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          mkdir -p "$WORK/control" "$WORK/archive"
          ar p "$DEB" control.tar.xz > "$WORK/original-control.tar.xz"
          ar p "$DEB" data.tar.xz > "$WORK/original-data.tar.xz"
          ar p "$DEB" control.tar.xz | tar -xJf - -C "$WORK/control"

          CONTROL="$WORK/control/control"
          test -f "$CONTROL"

          for FIELD in Maintainer Author; do
            if grep -q "^${FIELD}:" "$CONTROL"; then
              sed -i "s|^${FIELD}:.*|${FIELD}: M3gaIOS6p0w3r|" "$CONTROL"
            else
              printf '%s: M3gaIOS6p0w3r\n' "$FIELD" >> "$CONTROL"
            fi
          done

          tar --sort=name --owner=0 --group=0 --numeric-owner -cJf "$WORK/archive/control.tar.xz" -C "$WORK/control" .
          printf '2.0\n' > "$WORK/archive/debian-binary"
          cp "$WORK/original-data.tar.xz" "$WORK/archive/data.tar.xz"

          (cd "$WORK/archive" && ar cr "$GITHUB_WORKSPACE/$DEB.new" debian-binary control.tar.xz data.tar.xz)
          mv "$DEB.new" "$DEB"

          # The installed theme payload must remain byte-for-byte unchanged.
          ar p "$DEB" data.tar.xz > "$WORK/rebuilt-data.tar.xz"
          cmp "$WORK/original-data.tar.xz" "$WORK/rebuilt-data.tar.xz"

          echo "=== Updated package control fields ==="
          dpkg-deb -I "$DEB" control
          dpkg-deb --field "$DEB" Maintainer
          dpkg-deb --field "$DEB" Author

      - name: Regenerate Cydia package indexes
        shell: bash
        run: |
          set -euo pipefail
          dpkg-scanpackages --multiversion debs /dev/null | sed 's|^Filename: debs/|Filename: ./debs/|' > Packages
          gzip -n -9c Packages > Packages.gz

          grep -q '^Package: com.caldwelljaeb.ebayslider.palelemon$' Packages
          grep -q '^Maintainer: M3gaIOS6p0w3r$' Packages
          grep -q '^Author: M3gaIOS6p0w3r$' Packages
          grep -q '^Filename: ./debs/com.caldwelljaeb.ebayslider.palelemon_1.0_iphoneos-arm.deb$' Packages
          grep -q '^Package: com.m3ga.appcustomizer$' Packages
          grep -q '^Version: 0.1.7$' Packages
          grep -q '^Filename: ./debs/com.m3ga.appcustomizer_0.1.7_iphoneos-arm.deb$' Packages

      - name: Rebuild Release checksums and remove duplicate files
        shell: bash
        run: |
          set -euo pipefail

          {
            cat <<'EOF'
          Origin: M3gaIOS6p0w3r
          Label: M3gaIOS6p0w3r
          Suite: stable
          Codename: stable
          Architectures: iphoneos-arm
          Components: main
          Description: Classic iOS jailbreak tweaks, themes, and utilities.

          MD5Sum:
          EOF
            for FILE in Packages Packages.gz; do
              printf ' %s %8s %s\n' "$(md5sum "$FILE" | cut -d' ' -f1)" "$(stat -c '%s' "$FILE")" "$FILE"
            done
            printf '\nSHA256:\n'
            for FILE in Packages Packages.gz; do
              printf ' %s %8s %s\n' "$(sha256sum "$FILE" | cut -d' ' -f1)" "$(stat -c '%s' "$FILE")" "$FILE"
            done
          } > Release

          rm -f 'Packages (3)' 'Packages (3).gz' 'Release (3)'

      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Package index ==='
          cat Packages
          echo '=== Release metadata ==='
          cat Release
          echo '=== Remaining top-level index files ==='
          find . -maxdepth 1 -type f \( -name 'Packages*' -o -name 'Release*' \) -printf '%f\n' | sort
          test -s Packages
          test -s Packages.gz
          test -s Release
          test ! -e 'Packages (3)'
          test ! -e 'Packages (3).gz'
          test ! -e 'Release (3)'

      - name: Commit corrected repository metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debs Packages Packages.gz Release
          if git diff --cached --quiet; then
            echo "Repository metadata is already up to date."
            exit 0
          fi
          git commit -m "Fix Cydia package metadata and regenerate indexes"
          git push
