name: Build M3gaGravity

on:
  push:
    branches:
      - main
      - m3gagravity-v1
    paths:
      - "M3gaGravity/**"
      - ".github/workflows/m3gagravity-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "M3gaGravity/**"
      - ".github/workflows/m3gagravity-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out M3gaGravity
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Patch iOS 9.3 SDK stubs for ARMv7 Linux linking
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          sdk = Path(os.environ["THEOS"]) / "sdks" / "iPhoneOS9.3.sdk"
          if not sdk.is_dir():
              raise SystemExit(f"Expected SDK not found: {sdk}")

          changed = 0
          scanned = 0

          for stub in sdk.rglob("*.tbd"):
              scanned += 1
              lines = stub.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
              updated_lines = []

              for line in lines:
                  if line.startswith("archs:") and "[" in line and "]" in line:
                      before, values_and_after = line.split("[", 1)
                      values, after = values_and_after.split("]", 1)
                      arches = [item.strip() for item in values.split(",") if item.strip()]
                      filtered = [item for item in arches if item not in {"i386", "x86_64"}]
                      if filtered != arches:
                          changed += 1
                          line = before + "[" + ", ".join(filtered) + "]" + after
                  updated_lines.append(line)

              updated = "".join(updated_lines)
              original = stub.read_text(encoding="utf-8", errors="replace")
              if updated != original:
                  stub.write_text(updated, encoding="utf-8")

          print(f"Scanned {scanned} SDK stubs; corrected {changed} top-level architecture lists.")
          if changed == 0:
              raise SystemExit("No simulator architecture entries were found; stop rather than silently building with an uncorrected SDK.")

          # The public iOS 9.3 SDK's libSystem.B.tbd re-exports liblaunch,
          # but the corresponding device library is not present in this SDK.
          # Apple's linker therefore fails before producing the tweak binary.
          # Remove only that unavailable re-export from the SDK metadata;
          # do not fabricate or package a replacement runtime library.
          removed = 0
          for stub in sdk.rglob("*.tbd"):
              original = stub.read_text(encoding="utf-8", errors="replace")
              updated = original.replace(", /usr/lib/system/liblaunch.dylib", "")
              removed += original.count("/usr/lib/system/liblaunch.dylib") - updated.count("/usr/lib/system/liblaunch.dylib")
              if updated != original:
                  stub.write_text(updated, encoding="utf-8")

          print(f"Removed {removed} unavailable liblaunch re-export reference(s) from SDK metadata.")
          if removed == 0:
              raise SystemExit("Expected liblaunch re-export was not found; stop rather than silently building with an unpatched SDK.")
          PY

      - name: Build ARMv7 Debian package
        working-directory: M3gaGravity
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          DEB="$(find M3gaGravity/packages -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          python3 M3gaGravity/Tests/verify_preferences.py "$DEB"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: M3gaGravity-deb
          path: M3gaGravity/packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Publish Debian package and refresh Cydia indexes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find M3gaGravity/packages -name '*.deb' -print -quit)"
          test -n "$DEB"

          PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          VERSION="$(dpkg-deb -f "$DEB" Version)"
          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          test "$PACKAGE" = "com.m3ga.m3gagravity"
          test "$VERSION" = "0.2.15"
          test "$ARCH" = "iphoneos-arm"

          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          mkdir -p debs
          DEST="debs/${PACKAGE}_${VERSION}_${ARCH}.deb"
          install -m 0644 "$DEB" "$DEST"

          dpkg-scanpackages --multiversion debs /dev/null \
            | sed 's|^Filename: debs/|Filename: ./debs/|' > Packages
          gzip -n -9c Packages > Packages.gz

          grep -q '^Package: com.m3ga.m3gagravity
  report:
    runs-on: ubuntu-22.04
    needs: build
    if: always()
    steps:
      - name: Publish build status
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = "${{ needs.build.result }}" === "success";
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: succeeded ? "success" : "failure",
              context: "m3gagravity/build",
              description: succeeded
                ? "ARMv7 Debian package built and verified"
                : "Build failed; inspect the Actions logs",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
 Packages
          grep -q '^Version: 0.2.15
  report:
    runs-on: ubuntu-22.04
    needs: build
    if: always()
    steps:
      - name: Publish build status
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = "${{ needs.build.result }}" === "success";
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: succeeded ? "success" : "failure",
              context: "m3gagravity/build",
              description: succeeded
                ? "ARMv7 Debian package built and verified"
                : "Build failed; inspect the Actions logs",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
 Packages
          grep -q '^Filename: ./debs/com.m3ga.m3gagravity_0.2.15_iphoneos-arm.deb
  report:
    runs-on: ubuntu-22.04
    needs: build
    if: always()
    steps:
      - name: Publish build status
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = "${{ needs.build.result }}" === "success";
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: succeeded ? "success" : "failure",
              context: "m3gagravity/build",
              description: succeeded
                ? "ARMv7 Debian package built and verified"
                : "Build failed; inspect the Actions logs",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
 Packages
          grep -qi 'Hold an app icon briefly, then move your finger' Packages

          {
            cat <<'EOF'
          Origin: M3gaIOS6p0w3r
          Label: M3gaIOS6p0w3r
          Suite: stable
          Codename: stable
          Architectures: iphoneos-arm
          Components: main
          Description: Classic iOS jailbreak tweaks, themes, and utilities.

          MD5Sum:
          EOF
            for FILE in Packages Packages.gz; do
              printf ' %s %8s %s\n' "$(md5sum "$FILE" | cut -d' ' -f1)" "$(stat -c '%s' "$FILE")" "$FILE"
            done
            printf '\nSHA256:\n'
            for FILE in Packages Packages.gz; do
              printf ' %s %8s %s\n' "$(sha256sum "$FILE" | cut -d' ' -f1)" "$(stat -c '%s' "$FILE")" "$FILE"
            done
          } > Release

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DEST" Packages Packages.gz Release
          if git diff --cached --quiet; then
            echo "Cydia repository already contains the current M3gaGravity package."
            exit 0
          fi
          git commit -m "Publish M3gaGravity 0.2.15 to Cydia repository"
          git push

  report:
    runs-on: ubuntu-22.04
    needs: build
    if: always()
    steps:
      - name: Publish build status
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = "${{ needs.build.result }}" === "success";
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: succeeded ? "success" : "failure",
              context: "m3gagravity/build",
              description: succeeded
                ? "ARMv7 Debian package built and verified"
                : "Build failed; inspect the Actions logs",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
