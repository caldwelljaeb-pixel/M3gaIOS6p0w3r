name: Build M3gaSignalBars (test only)

on:
  push:
    branches:
      - m3gasignalbars-build-0.1.0
    paths:
      - "M3gaSignalBars/**"
      - ".github/workflows/m3gasignalbars-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Patch iOS 9.3 SDK stubs for ARMv7 linking
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          sdk = Path(os.environ["THEOS"]) / "sdks" / "iPhoneOS9.3.sdk"
          if not sdk.is_dir():
              raise SystemExit(f"Expected SDK not found: {sdk}")

          changed = 0
          for stub in sdk.rglob("*.tbd"):
              original = stub.read_text(encoding="utf-8", errors="replace")
              lines = original.splitlines(keepends=True)
              updated_lines = []
              for line in lines:
                  if line.startswith("archs:") and "[" in line and "]" in line:
                      before, values_and_after = line.split("[", 1)
                      values, after = values_and_after.split("]", 1)
                      arches = [item.strip() for item in values.split(",") if item.strip()]
                      filtered = [item for item in arches if item not in {"i386", "x86_64"}]
                      if filtered != arches:
                          changed += 1
                          line = before + "[" + ", ".join(filtered) + "]" + after
                  updated_lines.append(line)
              updated = "".join(updated_lines)
              if updated != original:
                  stub.write_text(updated, encoding="utf-8")

          if changed == 0:
              raise SystemExit("Expected simulator architecture entries were not found.")

          removed = 0
          for stub in sdk.rglob("*.tbd"):
              original = stub.read_text(encoding="utf-8", errors="replace")
              updated = original.replace(", /usr/lib/system/liblaunch.dylib", "")
              removed += original.count("/usr/lib/system/liblaunch.dylib") - updated.count("/usr/lib/system/liblaunch.dylib")
              if updated != original:
                  stub.write_text(updated, encoding="utf-8")
          print(f"Corrected {changed} architecture list(s); removed {removed} unavailable liblaunch re-export reference(s).")
          PY

      - name: Build ARMv7 Debian package
        working-directory: M3gaSignalBars
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Verify package and architecture
        run: |
          DEB="$(find M3gaSignalBars/packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          python3 M3gaSignalBars/Tests/verify_package.py "$DEB"
          file "$(mktemp -u)" >/dev/null 2>&1 || true
          DYLIB_DIR="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$DYLIB_DIR"
          file "$DYLIB_DIR/Library/MobileSubstrate/DynamicLibraries/M3gaSignalBars.dylib"
          rm -rf "$DYLIB_DIR"

      - name: Upload test Debian package
        uses: actions/upload-artifact@v4
        with:
          name: M3gaSignalBars-0.1.0-deb
          path: M3gaSignalBars/packages/*.deb
          if-no-files-found: error
          retention-days: 14
